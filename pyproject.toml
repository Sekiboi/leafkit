[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekikit"
version = "0.15.0b1"
description = "Offline PDF page toolkit with CLI — free forever, no paid tier."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sekiboi" }]
keywords = ["pdf", "merge", "split", "extract", "rotate", "offline", "freeware"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Environment :: Win32 (MS Windows)",
]
dependencies = [
  "pypdf>=5.0.0",
  "customtkinter>=5.2.0",
  "Pillow>=10.0.0",
  "tkinterdnd2>=0.3.0",
  "pymupdf>=1.24.0",
  "cryptography>=3.1",
]

[project.scripts]
sekikit = "sekikit.cli:main"
sekikit-gui = "sekikit.app:main"

[project.urls]
Homepage = "https://github.com/Sekiboi/sekikit"
Repository = "https://github.com/Sekiboi/sekikit"
Issues = "https://github.com/Sekiboi/sekikit/issues"

[tool.setuptools.packages.find]
include = ["sekikit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
