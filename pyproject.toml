[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "justpages"
version = "0.1.0"
description = "Offline PDF page toolkit: merge, extract, split, rotate — no upload."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sekiboi" }]
keywords = ["pdf", "merge", "split", "extract", "rotate", "offline", "freeware"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Environment :: Win32 (MS Windows)",
]
dependencies = [
  "pypdf>=5.0.0",
  "customtkinter>=5.2.0",
  "Pillow>=10.0.0",
]

[project.scripts]
justpages = "justpages.app:main"

[project.urls]
Homepage = "https://github.com/Sekiboi/justpages"
Repository = "https://github.com/Sekiboi/justpages"
Issues = "https://github.com/Sekiboi/justpages/issues"

[tool.setuptools.packages.find]
include = ["justpages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
